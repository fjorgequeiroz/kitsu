HTTP_PORT=5800				# Kitsu web UI port

# ── PostgreSQL ────────────────────────────────────────────────────────────────
DB_PASSWORD=9rei4uoYaiy2#phi@e		# password for the 'postgres' superuser
DB_PORT=5432				# PostgreSQL listening port (default 5432)

# ── Kitsu admin account ───────────────────────────────────────────────────────
ADMIN_EMAIL=contato@fernandojorge.art
